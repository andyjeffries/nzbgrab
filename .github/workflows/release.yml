name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          LDFLAGS="-s -w -X main.version=$VERSION"
          
          mkdir -p dist
          
          # Darwin
          GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/nzbgrab-darwin-amd64 ./cmd/nzbgrab
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/nzbgrab-darwin-arm64 ./cmd/nzbgrab
          
          # Linux
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/nzbgrab-linux-amd64 ./cmd/nzbgrab
          GOOS=linux GOARCH=arm64 go build -ldflags "$LDFLAGS" -o dist/nzbgrab-linux-arm64 ./cmd/nzbgrab
          
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags "$LDFLAGS" -o dist/nzbgrab-windows-amd64.exe ./cmd/nzbgrab

      - name: Build .deb package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          
          mkdir -p dist/deb/nzbgrab_${VERSION}_amd64/DEBIAN
          mkdir -p dist/deb/nzbgrab_${VERSION}_amd64/usr/bin
          mkdir -p dist/deb/nzbgrab_${VERSION}_amd64/usr/share/doc/nzbgrab
          
          cp dist/nzbgrab-linux-amd64 dist/deb/nzbgrab_${VERSION}_amd64/usr/bin/nzbgrab
          cp README.md dist/deb/nzbgrab_${VERSION}_amd64/usr/share/doc/nzbgrab/
          cp LICENSE dist/deb/nzbgrab_${VERSION}_amd64/usr/share/doc/nzbgrab/copyright
          
          cat > dist/deb/nzbgrab_${VERSION}_amd64/DEBIAN/control << EOF
          Package: nzbgrab
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Andy Jeffries <andy@andyjeffries.co.uk>
          Description: Fast parallel NZB downloader
           A fast, parallel NZB downloader for Usenet with automatic
           PAR2 verification, archive extraction, and file deobfuscation.
          Recommends: par2, unrar, p7zip-full, unzip
          Homepage: https://github.com/andyjeffries/nzbgrab
          EOF
          
          dpkg-deb --build dist/deb/nzbgrab_${VERSION}_amd64
          mv dist/deb/nzbgrab_${VERSION}_amd64.deb dist/

      - name: Generate checksums
        run: cd dist && sha256sum nzbgrab-* *.deb > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
